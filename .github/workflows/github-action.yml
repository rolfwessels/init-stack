name: CI and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Compute version
        id: version
        run: echo "value=$(make -s print-version)" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: dotnet test InitStack.sln -c Release

  package:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: &release_matrix
        include:
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: osx-x64, runner: macos-15-intel }
          - { rid: osx-arm64, runner: macos-15 }
          - { rid: win-x64, runner: windows-2025 }
          - { rid: win-arm64, runner: windows-11-arm }
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build and package
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish src/InitStack.Cmd/InitStack.Cmd.csproj -r $env:RID -c Release `
            -p:PublishProfile=ReleaseBinary "-p:Version=$env:VERSION" -o dist/publish

          $name = if ($IsWindows) { 'init-stack.exe' } else { 'init-stack' }
          $files = @(Get-ChildItem -Force dist/publish)
          if ($files.Count -ne 1 -or $files[0].Name -ne $name) {
            throw "Expected just $name in the publish output for $env:RID."
          }
          $archive = Join-Path (Get-Location) "dist/init-stack-$env:RID.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path dist/publish).Path, $archive)
      - name: Smoke test the packaged executable
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $scratch = Join-Path $env:RUNNER_TEMP 'init-stack-smoke'
          $unpacked = Join-Path $scratch 'unpacked'
          Expand-Archive -Path "dist/init-stack-$env:RID.zip" -DestinationPath $unpacked
          $name = if ($IsWindows) { 'init-stack.exe' } else { 'init-stack' }
          $exe = Join-Path $unpacked $name
          if (!$IsWindows) { chmod +x $exe }
          $version = (& $exe --version | Out-String).Trim()
          if ($version -ne $env:VERSION) {
            throw "Expected CLI version $env:VERSION, got $version."
          }
          & $exe --help

          $template = Join-Path $scratch 'TemplateProject'
          New-Item -ItemType Directory -Path $template | Out-Null
          Set-Content -Path (Join-Path $template 'TemplateProject.cs') -Value 'class TemplateProject {}'
          $output = Join-Path $scratch 'output'
          & $exe new $template SmokeApp -o $output --git-name 'Init Stack CI' --git-email 'ci@example.com'
          $project = Join-Path $output 'SmokeApp'
          if ((Get-Content -Raw (Join-Path $project 'SmokeApp.cs')).Trim() -cne 'class SmokeApp {}') {
            throw "The generated file was not renamed and updated."
          }
          git -C $project rev-parse --verify HEAD

          if ($IsLinux) {
            docker run --rm --mount "type=bind,src=$unpacked,dst=/app,readonly" `
              mcr.microsoft.com/dotnet/runtime-deps:10.0 /app/init-stack --version
          }
      - uses: actions/upload-artifact@v7
        with:
          name: init-stack-${{ matrix.rid }}
          path: dist/init-stack-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    needs: [test, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: init-stack-release
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: init-stack-*
          merge-multiple: true
          path: dist
      - name: Publish the tested archives
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          archives=(init-stack-{linux,osx,win}-{x64,arm64}.zip)
          sha256sum "${archives[@]}" > checksums.txt
          target="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" "refs/tags/$tag^{}" | awk 'END { print $1 }')"
          if [[ -n "$target" && "$target" != "$GITHUB_SHA" ]]; then
            echo "::error::$tag already points to $target instead of $GITHUB_SHA."
            exit 1
          fi

          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == false ]]; then
              test "$target" = "$GITHUB_SHA"
              echo "$tag is already published."
              exit 0
            fi
            draft_target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            test "$draft_target" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --title "Init Stack $tag" --generate-notes \
              --notes "[Install or upgrade on macOS, Windows, and Linux](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/README.md#installation)"
          fi

          gh release upload "$tag" "${archives[@]}" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber

          highest="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | awk '/^v[0-9]+(\.[0-9]+)+$/' | sort -V | tail -n 1)"
          latest=false
          if [[ "$(printf '%s\n' "$highest" "$tag" | sort -V | tail -n 1)" == "$tag" ]]; then
            latest=true
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"

  verify-install:
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: *release_matrix
    steps:
      - name: Install and reinstall from the public URL
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export INSTALL_DIR="$RUNNER_TEMP/init-stack install"
          curl -fsSL https://raw.githubusercontent.com/rolfwessels/init-stack/main/scripts/install.sh | sh
          curl -fsSL https://raw.githubusercontent.com/rolfwessels/init-stack/main/scripts/install.sh | sh
          "$INSTALL_DIR/init-stack" --version
      - name: Install and reinstall from the public URL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'init-stack install'
          irm https://raw.githubusercontent.com/rolfwessels/init-stack/main/scripts/install.ps1 | iex
          irm https://raw.githubusercontent.com/rolfwessels/init-stack/main/scripts/install.ps1 | iex
          init-stack --version
